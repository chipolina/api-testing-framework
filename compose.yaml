services:
  postgres:
    image: postgres:18.6
    container_name: api-testing-postgres
    environment:
      POSTGRES_DB: api_testing
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d api_testing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: api_testing
      DB_USER: test_user
      DB_PASSWORD: test_password
      LOCAL_API_BASE_URL: http://localhost:8000

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: api_testing
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d api_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database schema and sample data
        run: psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}

      - name: Migrate database for the local API
        run: python -m scripts.migrate_db

      - name: Start local API
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/local-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$LOCAL_API_BASE_URL/health"; then
              echo
              exit 0
            fi
            sleep 2
          done
          cat /tmp/local-api.log
          exit 1

      - name: Run tests
        run: python -m pytest

      - name: Set up Java
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure HTML report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
